[package]
name = "threadcat"
description = "Converts a Mastodon thread to Markdown, and downloads all contained media files."
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/blinry/threadcat"
keywords = [
    "markdown",
    "mastodon",
]
categories = [ "command-line-utilities" ]
edition = "2024"

[dependencies]
anyhow = "1.0.86"
chrono = "0.4.44"
futures = "0.3.32"
mdka = "1.2.10"
megalodon = "1.2.1"
regex = "1.10.6"
reqwest = { version = "0.13.0", features = ["rustls"] }
tokio = "1.39.3"
url = "2.5.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
